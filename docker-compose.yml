# Docker Compose for the Zig seed finder.
#
# stdout (progress) → output/progress.log
# stderr (JSONL)   → output/seeds_N.jsonl (rotating, auto-resume)
#
# Usage:
#   docker compose up --build
#   docker compose up -d          # background
#   tail -f output/progress.log   # monitor

services:
  seedgen:
    build:
      context: .
      dockerfile: Dockerfile.zig
    env_file:
      - .env
    environment:
      - COUNT=1000000
      - SE_K2=1
      - MIN_NAQ_DV=20000
      - MIN_PROD_MODULES=4
    restart: always
    volumes:
      - ./output:/workspace/output
