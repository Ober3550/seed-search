# Docker Compose for the Zig seed finder — single range per container.
# Orchestrate externally: run one container per 100K bucket.
#
#   docker compose run --rm -e START_SEED=341 -e COUNT=100000 seedgen

services:
  seedgen:
    build:
      context: .
      dockerfile: runner/zig/Dockerfile.zig
    environment:
      - END_SEED=100000
      - SE_K2=1
      - MIN_NAQ_DV=20000
      - MIN_PROD_MODULES=4
    ulimits:
      stack: 1073741824
    volumes:
      - ./output:/workspace/output
