# Publish the static seed + surface pages to GitHub Pages
# (https://ober3550.github.io/seed-search/).
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "space_explorer_gui/public/**"
      - "surface_generator/src/**"
      - "universe_generator/zig/**"
      - "scripts/build-pages.mjs"
      - "install.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push supersedes a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build wasm modules
        run: node install.mjs --wasm-only
      - name: Assemble site
        run: node scripts/build-pages.mjs --out dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
